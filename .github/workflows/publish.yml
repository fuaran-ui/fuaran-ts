name: Publish to npm

# Publishes the @fuaran-ui/* package set (plus the two defensive placeholders)
# via npm TRUSTED PUBLISHING (OIDC): each package on npmjs.com carries a
# trusted-publisher policy naming this repo + this workflow file, and npm
# exchanges the job's OIDC token for publish credentials — no long-lived token
# secret. Provenance is attached automatically on OIDC publishes.
#
# pnpm builds and PACKS the tarballs (pnpm pack rewrites the workspace:*
# inter-package specifiers to real versions; raw `npm publish` from the
# package dirs would ship them broken), then npm >= 11.5 publishes each
# tarball. Already-published versions are skipped, so re-runs are idempotent.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (default "latest")'
        required: false
        default: latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token issuance for the npm trusted-publishing exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # No registry-url here: setup-node's registry-url writes an .npmrc that
      # demands a NODE_AUTH_TOKEN env var, which no longer exists — trusted
      # publishing authenticates via OIDC instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `pnpm pack` happily packs a private package; `npm publish` then refuses
      # it, so a private package in the loop fails the whole run. Filter here.
      - name: Pack (pnpm rewrites workspace:* specifiers; private packages skipped)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          for d in packages/*/; do
            if [ "$(node -p "require('./$d/package.json').private === true")" = "true" ]; then
              echo "skipped (private, not for the registry): $d"
              continue
            fi
            ( cd "$d" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs" )
          done

      # npm's OIDC trusted-publishing support needs npm >= 11.5; Node 22 ships 10.x.
      - name: Update npm
        run: npm install -g npm@11

      - name: Publish (OIDC; skips already-published versions)
        run: |
          set -o pipefail
          shopt -s nullglob
          fail=0
          tarballs=(./tarballs/*.tgz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "No tarballs produced — Pack step emitted nothing." >&2
            exit 1
          fi
          # The ./ prefix is load-bearing: npm parses a bare `dir/file.tgz`
          # as a GitHub owner/repo shorthand, not a local path.
          for t in "${tarballs[@]}"; do
            if out=$(npm publish "$t" --access public --tag "${{ inputs.tag || 'latest' }}" 2>&1); then
              echo "published: $(basename "$t")"
            elif echo "$out" | grep -qiE 'previously published|cannot publish over|EPUBLISHCONFLICT|E409'; then
              echo "skipped (version already on the registry): $(basename "$t")"
            elif echo "$out" | grep -qiE 'ENEEDAUTH|need auth'; then
              # OIDC cannot publish a package's FIRST version: npmjs.com will not
              # let a trusted publisher be configured until the package exists
              # (npm/cli#8544). So ENEEDAUTH here almost always means "never
              # bootstrapped", not "credentials broken" — the raw npm message
              # says `npm adduser`, which sends you down the wrong path.
              echo "FAILED (not yet bootstrapped on the registry): $(basename "$t")" >&2
              echo "  A package's first version cannot be published via OIDC." >&2
              echo "  One-time fix, by an operator with npm access:" >&2
              echo "    1. npm publish <tarball> --access public   (local, authenticated)" >&2
              echo "    2. npmjs.com -> the package -> Settings -> add a trusted publisher" >&2
              echo "       naming this repo and this workflow file (publish.yml)." >&2
              echo "  Afterwards this job publishes it via OIDC like every other package." >&2
              fail=1
            else
              echo "FAILED: $(basename "$t")" >&2
              echo "$out" >&2
              fail=1
            fi
          done
          exit $fail
