name: Publish to npm

# Publishes the @fuaran-ui/* package set (plus the two defensive placeholders)
# via npm TRUSTED PUBLISHING (OIDC): each package on npmjs.com carries a
# trusted-publisher policy naming this repo + this workflow file, and npm
# exchanges the job's OIDC token for publish credentials — no long-lived token
# secret. Provenance is attached automatically on OIDC publishes.
#
# pnpm builds and PACKS the tarballs (pnpm pack rewrites the workspace:*
# inter-package specifiers to real versions; raw `npm publish` from the
# package dirs would ship them broken), then npm >= 11.5 publishes each
# tarball. Already-published versions are skipped, so re-runs are idempotent.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (default "latest") — letters, digits, dot, dash, underscore'
        required: false
        default: latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token issuance for the npm trusted-publishing exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      # No registry-url here: setup-node's registry-url writes an .npmrc that
      # demands a NODE_AUTH_TOKEN env var, which no longer exists — trusted
      # publishing authenticates via OIDC instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The dist-tag is OPERATOR INPUT, and a `${{ }}` expression is substituted
      # into the script TEXT before any shell parses it — so an input carrying a
      # quote escapes its own quoting and the rest is command. Two guards, and
      # both are needed:
      #
      #   * it reaches the publish step through the ENVIRONMENT (`env:` below),
      #     never through interpolation, so the value is data to the shell; and
      #   * it is validated here against the shape npm actually accepts, so a
      #     malformed tag fails at a step that says so rather than at `npm
      #     publish` after some packages have already gone out.
      #
      # The check runs on the resolved value, not on the input, so the `v*`-tag
      # path (where the input is absent and the default applies) is covered by
      # the same statement.
      - name: Validate the dist-tag
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          case "$NPM_DIST_TAG" in
            *[!A-Za-z0-9._-]* | '' | [0-9]*)
              echo "Refusing dist-tag '$NPM_DIST_TAG'." >&2
              echo "A dist-tag must be non-empty, must not begin with a digit (npm reads" >&2
              echo "that as a version), and may contain only letters, digits, dot, dash" >&2
              echo "and underscore." >&2
              exit 1
              ;;
          esac
          echo "dist-tag: $NPM_DIST_TAG"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `pnpm pack` happily packs a private package; `npm publish` then refuses
      # it, so a private package in the loop fails the whole run. Filter here.
      - name: Pack (pnpm rewrites workspace:* specifiers; private packages skipped)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          for d in packages/*/; do
            if [ "$(node -p "require('./$d/package.json').private === true")" = "true" ]; then
              echo "skipped (private, not for the registry): $d"
              continue
            fi
            ( cd "$d" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs" )
          done

      # npm's OIDC trusted-publishing support needs npm >= 11.5; Node 22 ships 10.x.
      - name: Update npm
        run: npm install -g npm@11

      # No "the tag equals the package versions" check here, and that is a
      # decision rather than an omission — the obvious guard is unimplementable
      # in this repository and would refuse every legitimate release.
      #
      # The packages are INDEPENDENTLY VERSIONED. At v0.9.0 the workspace held
      # `@fuaran-ui/ops` 0.25.0, `@fuaran-ui/renderer` 0.21.0, `@fuaran-ui/cli`
      # 0.11.0 and two placeholders on `0.0.0-placeholder.2`, among others: a
      # package's version tracks ITS OWN surface, while the tag marks a
      # repository release. There is no version for a tag to equal.
      #
      # What keeps the two honest instead: `npm publish` refuses to overwrite an
      # existing version, and the loop below treats that refusal as a SKIP — so
      # a package whose version did not move is simply not republished, and a
      # tag cut without bumping anything publishes nothing at all. The failure
      # this check would have caught (a tag naming a version nobody bumped) is
      # therefore already inert.
      - name: Publish (OIDC; skips already-published versions)
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -o pipefail
          shopt -s nullglob
          fail=0
          tarballs=(./tarballs/*.tgz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "No tarballs produced — Pack step emitted nothing." >&2
            exit 1
          fi
          # The ./ prefix is load-bearing: npm parses a bare `dir/file.tgz`
          # as a GitHub owner/repo shorthand, not a local path.
          for t in "${tarballs[@]}"; do
            if out=$(npm publish "$t" --access public --tag "$NPM_DIST_TAG" 2>&1); then
              echo "published: $(basename "$t")"
            elif echo "$out" | grep -qiE 'previously published|cannot publish over|EPUBLISHCONFLICT|E409'; then
              echo "skipped (version already on the registry): $(basename "$t")"
            elif echo "$out" | grep -qiE 'ENEEDAUTH|need auth'; then
              # OIDC cannot publish a package's FIRST version: npmjs.com will not
              # let a trusted publisher be configured until the package exists
              # (npm/cli#8544). So ENEEDAUTH here almost always means "never
              # bootstrapped", not "credentials broken" — the raw npm message
              # says `npm adduser`, which sends you down the wrong path.
              echo "FAILED (OIDC has no publish rights for this package): $(basename "$t")" >&2
              echo "  Two distinct causes, both needing an operator with npm access:" >&2
              echo "  (a) The package does not exist yet. A first version CANNOT be" >&2
              echo "      published via OIDC — npmjs.com will not let a trusted publisher" >&2
              echo "      be configured until the package exists (npm/cli#8544). Publish" >&2
              echo "      it once locally: npm publish ./<tarball> --access public" >&2
              echo "  (b) It exists but has no trusted publisher attached — the common" >&2
              echo "      case right after (a). npmjs.com -> the package -> Settings ->" >&2
              echo "      Trusted publisher -> this repo + this workflow filename," >&2
              echo "      exactly, INCLUDING the .yml extension (a mismatched filename" >&2
              echo "      surfaces as this same ENEEDAUTH)." >&2
              echo "  Check which by looking the package up on the registry." >&2
              fail=1
            else
              echo "FAILED: $(basename "$t")" >&2
              echo "$out" >&2
              fail=1
            fi
          done
          exit $fail
