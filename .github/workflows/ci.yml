name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-ts
    steps:
      # The corpus-parity tests resolve the conformance corpus as a SIBLING of
      # the repo root (../wire-format-fixtures — see CONTRIBUTING.md), so this
      # repo is checked out into a subdirectory and the corpus beside it, the
      # same layout fuaran-live's workflows use. The corpus stays UNPINNED on
      # purpose: it is the shared conformance gate every host certifies
      # against, and one current spec for all hosts is the point of giving it
      # a single home.
      - uses: actions/checkout@v4
        with:
          path: fuaran-ts

      - name: Checkout the wire-format corpus (fuaran-ui-specification)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      # The corpus checkout is AUTHORITATIVE: corpus-dependent suites must run,
      # not skip. Several tests skip-if-absent to tolerate a standalone clone;
      # this guard fails the job if a layout drift would silently re-enable
      # those skips.
      - name: Assert the corpus is where the tests resolve it
        run: test -f ../wire-format-fixtures/manifest.json

      # The SECOND corpus: the model-execution wire specification, whose spec-hash
      # family pins the `canonical-json-sha256-v1` minting rule that
      # packages/spec-hash implements. Same layout convention as above — a sibling
      # of the repo root, the DIRECTORY name being the interface.
      #
      # The specification repo went PUBLIC at Fuaran-Core/fuaran-model-execution-spec
      # (re-homed + flipped 2026-08-29), so the checkout needs no token — the
      # SPEC_CORPUS_TOKEN secret and its provisioning assert are retired. The
      # corpus remains AUTHORITATIVE: the layout assert below still fails the job
      # loudly if the corpus does not arrive, because a conformance suite left
      # unrun on a green build reads as "the implementation still agrees with the
      # spec" — do NOT make it skip-when-absent.
      - name: Checkout the model-execution wire specification
        uses: actions/checkout@v4
        with:
          repository: Fuaran-Core/fuaran-model-execution-spec
          path: fuaran-model-execution-spec

      - name: Assert the specification corpus is where the tests resolve it
        run: test -f ../fuaran-model-execution-spec/wire-fixtures/manifest.json

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fuaran-ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuaran-ts/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Typecheck covers what Build does not: each package's `build` compiles
      # `src/` only, so a type error in `test/` — the tsconfig.test.json
      # projects — reaches no gate at all. Vitest transpiles per-file without
      # checking types, so `pnpm test` is green on it too. That is not
      # hypothetical: five such errors stood on `main` while format:check,
      # build and test were all green, because nothing in CI ran `tsc` over a
      # test tree. Runs AFTER Build, because the workspace links resolve a
      # sibling package through its published `types` entry under `dist/`.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # The cross-host scaffold parity lane (Phase 1625).
  #
  # `packages/mcp/test/scaffold-parity.test.ts` asserts that the two SDK legs the
  # `scaffold` tool wires — the TS `@fuaran-ui/client` and the F# `Fuaran.UI.Cli`
  # dotnet tool — produce the SAME canonical tree for the same turn. That needs a
  # .NET toolchain and the F# host repository, so it lives in its own job rather
  # than in `build`: this assertion's inputs are not the inputs of the rest of the
  # suite, and a failure here is attributable on sight instead of reddening a lane
  # about TypeScript.
  #
  # It used to need neither, because the test skipped whenever the sibling's Debug
  # build output was absent — which on CI it always was. The suite reported green
  # having asserted nothing, on exactly the runs that would catch a divergence.
  # FUARAN_REQUIRE_FS_CLI makes the skip unreachable here: an absent sibling is a
  # layout drift, and this job fails on it rather than passing quietly.
  #
  # UNPINNED, for the reason the corpus checkouts above are unpinned: the claim is
  # that the two CURRENT reference implementations agree. A pinned ref would let
  # them drift apart and keep reporting green about a pair that no longer exists.
  scaffold-parity:
    name: Cross-host scaffold parity (TS <-> F#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fuaran-ts
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-ts

      - name: Checkout the F# host (fuaran-dotnet)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-dotnet
          path: fuaran-dotnet

      - name: Assert the F# host is where the test resolves it
        run: test -f ../fuaran-dotnet/src/Fuaran.UI.Cli/Fuaran.UI.Cli.fsproj

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: fuaran-dotnet/global.json

      # NU1301: the F# host's nuget.config declares a `local` folder source three
      # levels above its root for inner-loop iteration. It does not exist on the
      # runner, and NuGet hard-errors on a missing folder source rather than
      # treating it as empty — so mint it, as that nuget.config itself prescribes.
      # The published `Fuaran.Core.*` packages then resolve anonymously from
      # nuget.org.
      - name: Create the empty local NuGet feed dir (NU1301 workaround)
        run: mkdir -p "${{ github.workspace }}/../../local-nuget-feed"

      # Built HERE as well as by the test, so a compile failure is its own red
      # step with the compiler's output in it rather than a message inside a test
      # runner. The test's own build then finds everything current and costs
      # seconds. The dll path is NOT passed down: the test derives the framework
      # directory from the build's own output, so no target-framework moniker is
      # written into this workflow to go stale.
      - name: Build the F# CLI
        working-directory: fuaran-dotnet
        run: dotnet build src/Fuaran.UI.Cli/Fuaran.UI.Cli.fsproj -c Release --nologo

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fuaran-ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuaran-ts/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The mcp package's test imports its workspace siblings through their
      # published `types`/`import` entries under `dist/`.
      - name: Build
        run: pnpm build

      - name: Scaffold parity
        env:
          FUARAN_REQUIRE_FS_CLI: '1'
          FUARAN_FS_CLI_CONFIGURATION: Release
        run: pnpm --filter @fuaran-ui/mcp exec vitest run test/scaffold-parity.test.ts

  # Fire the workspace wire-format cross-implementation conformance gate after a
  # successful build on a push to main. Path filters in fuaran-ui/workspace cannot
  # see pushes to THIS repo, so we POST a `wire-conformance` repository_dispatch to
  # the workspace repo (whose .github/workflows/wire-conformance.yml listens on
  # `repository_dispatch: types: [wire-conformance]`; see the workspace
  # roadmap/TIDY-UP.md "Wire the cross-conformance gate trigger" bundle).
  #
  # Requires the org-level Actions secret FUARAN_WORKSPACE_APP_PRIVATE_KEY — the
  # private key of the `fuaran-ui-workspace-broker` GitHub App (app id 4797739),
  # installed on the dispatch target only. The workflow mints a SHORT-LIVED
  # installation token at run time (the App holds `Contents: write` there — the
  # scope the repository_dispatch REST endpoint requires); no long-lived token is
  # stored anywhere. The default GITHUB_TOKEN is scoped to THIS repo only and
  # cannot dispatch cross-repo. [OPERATOR-GATED — the org secret must be granted
  # to this repo for this to fire; until then the job skips rather than fails.]
  notify-workspace-conformance:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A secrets expression is not valid in a step-level `if:`, so the
      # presence probe goes through an env-var step output instead.
      - name: Check whether the org secret is granted here
        id: key-check
        env:
          HAS_KEY: ${{ secrets.FUARAN_WORKSPACE_APP_PRIVATE_KEY != '' }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Mint a workspace App installation token
        id: workspace-token
        if: steps.key-check.outputs.has_key == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: 4797739 # fuaran-ui-workspace-broker
          private-key: ${{ secrets.FUARAN_WORKSPACE_APP_PRIVATE_KEY }}
          owner: fuaran-ui
          repositories: workspace

      - name: Trigger workspace wire-format conformance gate
        env:
          GH_TOKEN: ${{ steps.workspace-token.outputs.token }}
        run: |
          # Operator-gated: until the org secret is granted here, skip rather
          # than fail — a red dispatch job on every main push would mask real
          # build/test failures. (The mint step above is if-guarded on the same
          # condition, so an ungranted repo skips it and lands here tokenless.)
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::FUARAN_WORKSPACE_APP_PRIVATE_KEY is not granted to this repo — skipping the workspace conformance dispatch (operator-gated)."
            exit 0
          fi
          gh api repos/fuaran-ui/workspace/dispatches \
            --method POST \
            -f event_type=wire-conformance \
            -f 'client_payload[source_repo]=fuaran-ts' \
            -f 'client_payload[sha]=${{ github.sha }}'
