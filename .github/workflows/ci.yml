name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-ts
    steps:
      # The corpus-parity tests resolve the conformance corpus as a SIBLING of
      # the repo root (../wire-format-fixtures — see CONTRIBUTING.md), so this
      # repo is checked out into a subdirectory and the corpus beside it, the
      # same layout fuaran-live's workflows use. The corpus stays UNPINNED on
      # purpose: it is the shared conformance gate every host certifies
      # against, and one current spec for all hosts is the point of giving it
      # a single home.
      - uses: actions/checkout@v4
        with:
          path: fuaran-ts

      - name: Checkout the wire-format corpus (fuaran-ui-specification)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      # The corpus checkout is AUTHORITATIVE: corpus-dependent suites must run,
      # not skip. Several tests skip-if-absent to tolerate a standalone clone;
      # this guard fails the job if a layout drift would silently re-enable
      # those skips.
      #
      # Every artefact a suite guards on is named here, not just the manifest.
      # `render-fidelity.json` is the generated §13 artefact two locks skip on —
      # `packages/schema/test/renderFidelity.test.ts` (this host's kind set
      # against the declared postures) and
      # `packages/renderer-server/test/renderObligations.test.ts` (a checker for
      # every declared obligation). Both read it from the corpus and both run
      # here today; asserting only the manifest meant the day it was renamed or
      # dropped they would go silent and this lane would stay green.
      - name: Assert the corpus is where the tests resolve it
        run: |
          test -f ../wire-format-fixtures/manifest.json
          test -f ../wire-format-fixtures/render-fidelity.json

      # The SECOND corpus: the model-execution wire specification, whose spec-hash
      # family pins the `canonical-json-sha256-v1` minting rule that
      # packages/spec-hash implements. Same layout convention as above — a sibling
      # of the repo root, the DIRECTORY name being the interface.
      #
      # The specification repo went PUBLIC at Fuaran-Core/fuaran-model-execution-spec
      # (re-homed + flipped 2026-08-29), so the checkout needs no token — the
      # SPEC_CORPUS_TOKEN secret and its provisioning assert are retired. The
      # corpus remains AUTHORITATIVE: the layout assert below still fails the job
      # loudly if the corpus does not arrive, because a conformance suite left
      # unrun on a green build reads as "the implementation still agrees with the
      # spec" — do NOT make it skip-when-absent.
      - name: Checkout the model-execution wire specification
        uses: actions/checkout@v4
        with:
          repository: Fuaran-Core/fuaran-model-execution-spec
          path: fuaran-model-execution-spec

      - name: Assert the specification corpus is where the tests resolve it
        run: test -f ../fuaran-model-execution-spec/wire-fixtures/manifest.json

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fuaran-ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuaran-ts/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Typecheck covers what Build does not: each package's `build` compiles
      # `src/` only, so a type error in `test/` — the tsconfig.test.json
      # projects — reaches no gate at all. Vitest transpiles per-file without
      # checking types, so `pnpm test` is green on it too. That is not
      # hypothetical: five such errors stood on `main` while format:check,
      # build and test were all green, because nothing in CI ran `tsc` over a
      # test tree. Runs AFTER Build, because the workspace links resolve a
      # sibling package through its published `types` entry under `dist/`.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # The cross-host parity lane (Phase 1625) — every assertion that needs the F#
  # reference host checked out beside this repo.
  #
  # `packages/mcp/test/scaffold-parity.test.ts` asserts that the two SDK legs the
  # `scaffold` tool wires — the TS `@fuaran-ui/client` and the F# `Fuaran.UI.Cli`
  # dotnet tool — produce the SAME canonical tree for the same turn. That needs a
  # .NET toolchain and the F# host repository, so it lives in its own job rather
  # than in `build`: this assertion's inputs are not the inputs of the rest of the
  # suite, and a failure here is attributable on sight instead of reddening a lane
  # about TypeScript.
  #
  # It used to need neither, because the test skipped whenever the sibling's Debug
  # build output was absent — which on CI it always was. The suite reported green
  # having asserted nothing, on exactly the runs that would catch a divergence.
  # FUARAN_REQUIRE_FS_CLI makes the skip unreachable here: an absent sibling is a
  # layout drift, and this job fails on it rather than passing quietly.
  #
  # The lane also owns `packages/renderer-server/test/parity.test.tsx`'s LOCK B —
  # every `fuaran-*` class the server renderer emits must be in the vocabulary
  # extracted from the F# reference renderer's source. That lock guards on the
  # same sibling and had exactly the same hole for the same reason: the `build`
  # lane checks out no host, so `describe.skipIf(!referenceAvailable)` was true on
  # every run and the sweep reported green having read no reference vocabulary at
  # all. It belongs here because its input is this lane's input; it needs no .NET
  # toolchain (it reads F# SOURCE, never a build output), and
  # FUARAN_REQUIRE_FS_REFERENCE makes its skip unreachable here just as
  # FUARAN_REQUIRE_FS_CLI does for the scaffold leg.
  #
  # UNPINNED, for the reason the corpus checkouts above are unpinned: the claim is
  # that the two CURRENT reference implementations agree. A pinned ref would let
  # them drift apart and keep reporting green about a pair that no longer exists.
  scaffold-parity:
    name: Cross-host parity (TS <-> F#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fuaran-ts
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-ts

      - name: Checkout the F# host (fuaran-dotnet)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-dotnet
          path: fuaran-dotnet

      - name: Assert the F# host is where the test resolves it
        run: |
          test -f ../fuaran-dotnet/src/Fuaran.UI.Cli/Fuaran.UI.Cli.fsproj
          test -f ../fuaran-dotnet/src/Fuaran.UI.Renderer.Server/Render.fs

      # Lock B renders every node fixture, so the render-parity suite needs the
      # conformance corpus here too — it reads the fixture directory at module
      # load and would fail on its absence rather than skip. Same layout and same
      # unpinned posture as the `build` lane's checkout.
      - name: Checkout the wire-format corpus (fuaran-ui-specification)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      - name: Assert the corpus is where the tests resolve it
        run: test -d ../wire-format-fixtures/nodes

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: fuaran-dotnet/global.json

      # NU1301: the F# host's nuget.config declares a `local` folder source three
      # levels above its root for inner-loop iteration. It does not exist on the
      # runner, and NuGet hard-errors on a missing folder source rather than
      # treating it as empty — so mint it, as that nuget.config itself prescribes.
      # The published `Fuaran.Core.*` packages then resolve anonymously from
      # nuget.org.
      - name: Create the empty local NuGet feed dir (NU1301 workaround)
        run: mkdir -p "${{ github.workspace }}/../../local-nuget-feed"

      # Built HERE as well as by the test, so a compile failure is its own red
      # step with the compiler's output in it rather than a message inside a test
      # runner. The test's own build then finds everything current and costs
      # seconds. The dll path is NOT passed down: the test derives the framework
      # directory from the build's own output, so no target-framework moniker is
      # written into this workflow to go stale.
      - name: Build the F# CLI
        working-directory: fuaran-dotnet
        run: dotnet build src/Fuaran.UI.Cli/Fuaran.UI.Cli.fsproj -c Release --nologo

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fuaran-ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuaran-ts/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The mcp package's test imports its workspace siblings through their
      # published `types`/`import` entries under `dist/`.
      - name: Build
        run: pnpm build

      - name: Scaffold parity
        env:
          FUARAN_REQUIRE_FS_CLI: '1'
          FUARAN_FS_CLI_CONFIGURATION: Release
        run: pnpm --filter @fuaran-ui/mcp exec vitest run test/scaffold-parity.test.ts

      # Lock B (and Lock A alongside it — running the whole file rather than a
      # name filter, because a filter that matches nothing passes vacuously,
      # which is the failure class this step exists to close).
      - name: Render parity (Lock B — F# reference vocabulary)
        env:
          FUARAN_REQUIRE_FS_REFERENCE: '1'
        run: pnpm --filter @fuaran-ui/renderer-server exec vitest run test/parity.test.tsx

  # Fire the cross-implementation wire-format conformance gate after a successful
  # build on a push to main.
  #
  # That gate lives in a DOWNSTREAM CONSUMER repository — one that checks several
  # conformant hosts out together and certifies them against the same corpus —
  # and its path filters cannot see pushes to THIS repo. So we POST a
  # `wire-conformance` repository_dispatch to it; the consumer listens on
  # `repository_dispatch: types: [wire-conformance]`.
  #
  # The dispatch target is CONFIGURATION, not a constant: the repository variable
  # `CONFORMANCE_DISPATCH_REPO` names it as `owner/name`. Keeping it out of the
  # workflow text means this public file describes the mechanism without naming
  # anybody's repository, and a consumer that re-homes its gate changes a
  # variable rather than opening a pull request here.
  #
  # Credentials: the org-level Actions secret FUARAN_WORKSPACE_APP_PRIVATE_KEY is
  # the private key of a GitHub App (app id 4797739) installed on the dispatch
  # target only. The workflow mints a SHORT-LIVED installation token at run time
  # (the App holds `Contents: write` there — the scope the repository_dispatch
  # REST endpoint requires); no long-lived token is stored anywhere. The default
  # GITHUB_TOKEN is scoped to THIS repo only and cannot dispatch cross-repo.
  #
  # [OPERATOR-GATED — both the org secret and the variable must be granted to this
  # repo for this to fire; until then the job skips rather than fails, because a
  # red dispatch job on every main push would mask real build/test failures.]
  notify-downstream-conformance:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A secrets expression is not valid in a step-level `if:`, so the
      # presence probe goes through an env-var step output instead. The
      # VARIABLE is probed in the same step and by the same rule: an
      # unconfigured target is the same "not granted here" state as an
      # unconfigured key, and the two must gate together or the token mint
      # runs for a dispatch that cannot be addressed.
      - name: Check whether the dispatch credentials and target are granted here
        id: gate
        env:
          HAS_KEY: ${{ secrets.FUARAN_WORKSPACE_APP_PRIVATE_KEY != '' }}
          TARGET: ${{ vars.CONFORMANCE_DISPATCH_REPO }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ -n "$TARGET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "owner=${TARGET%%/*}" >> "$GITHUB_OUTPUT"
            echo "repo=${TARGET##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint an installation token for the dispatch target
        id: dispatch-token
        if: steps.gate.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: 4797739
          private-key: ${{ secrets.FUARAN_WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ steps.gate.outputs.owner }}
          repositories: ${{ steps.gate.outputs.repo }}

      - name: Trigger the downstream wire-format conformance gate
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          TARGET: ${{ vars.CONFORMANCE_DISPATCH_REPO }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Operator-gated: until the key and the target are both configured
          # here, skip rather than fail. (The mint step above is if-guarded on
          # the same condition, so an unconfigured repo skips it and lands here
          # tokenless.)
          if [ -z "$GH_TOKEN" ] || [ -z "$TARGET" ]; then
            echo "::notice::The downstream conformance dispatch is not configured here (needs the FUARAN_WORKSPACE_APP_PRIVATE_KEY secret and the CONFORMANCE_DISPATCH_REPO variable) — skipping."
            exit 0
          fi
          # Both values reach `gh` through the ENVIRONMENT rather than through
          # an expression, so neither is substituted into the script text before
          # a shell parses it. (And the word "expression" is spelled out here
          # rather than shown: a block scalar IS interpolated, so writing the
          # empty expression inside a run: comment is a workflow-parse failure —
          # a 0-second run named after the file, with no job and no log. That is
          # how this comment was first written, and it took the whole workflow
          # down. The YAML-level comment in publish.yml may show it because a
          # YAML comment is never evaluated; this one may not.)
          gh api "repos/$TARGET/dispatches" \
            --method POST \
            -f event_type=wire-conformance \
            -f "client_payload[source_repo]=fuaran-ts" \
            -f "client_payload[sha]=$SOURCE_SHA"
