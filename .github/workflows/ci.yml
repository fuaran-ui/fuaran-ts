name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-ts
    steps:
      # The corpus-parity tests resolve the conformance corpus as a SIBLING of
      # the repo root (../wire-format-fixtures — see CONTRIBUTING.md), so this
      # repo is checked out into a subdirectory and the corpus beside it, the
      # same layout fuaran-live's workflows use. The corpus stays UNPINNED on
      # purpose: it is the shared conformance gate every host certifies
      # against, and one current spec for all hosts is the point of giving it
      # a single home.
      - uses: actions/checkout@v4
        with:
          path: fuaran-ts

      - name: Checkout the wire-format corpus (fuaran-ui-specification)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      # The corpus checkout is AUTHORITATIVE: corpus-dependent suites must run,
      # not skip. Several tests skip-if-absent to tolerate a standalone clone;
      # this guard fails the job if a layout drift would silently re-enable
      # those skips.
      - name: Assert the corpus is where the tests resolve it
        run: test -f ../wire-format-fixtures/manifest.json

      # The SECOND corpus: the model-execution wire specification, whose spec-hash
      # family pins the `canonical-json-sha256-v1` minting rule that
      # packages/spec-hash implements. Same layout convention as above — a sibling
      # of the repo root, the DIRECTORY name being the interface.
      #
      # Unlike the wire-format corpus, this repository is PRIVATE, so the checkout
      # needs a token: an operator-provisioned repo/Actions secret
      # SPEC_CORPUS_TOKEN — a fine-grained PAT (or GitHub App token) with
      # `Contents: read` on fuaran-ui/fuaran-model-execution-spec. The default
      # GITHUB_TOKEN is scoped to THIS repo and cannot read another.
      #
      # This one FAILS LOUDLY when the secret is absent, deliberately, where the
      # cross-repo dispatch job below skips. The difference is what absence means:
      # a missing dispatch loses a downstream notification, while a missing corpus
      # would leave a conformance suite unrun on a green build — and everybody
      # reads a green build as "the implementation still agrees with the spec".
      - name: Assert the specification-corpus secret is provisioned
        env:
          SPEC_CORPUS_TOKEN: ${{ secrets.SPEC_CORPUS_TOKEN }}
        run: |
          if [ -z "$SPEC_CORPUS_TOKEN" ]; then
            echo "::error::SPEC_CORPUS_TOKEN is not provisioned. packages/spec-hash certifies against the" >&2
            echo "model-execution wire specification's corpus, which lives in a PRIVATE repository" >&2
            echo "(fuaran-ui/fuaran-model-execution-spec). Provision a fine-grained PAT with Contents:read" >&2
            echo "on that repository as the repo/Actions secret SPEC_CORPUS_TOKEN. Do NOT make the suite" >&2
            echo "skip-when-absent: a conformance gate that quietly does nothing is worse than absent," >&2
            echo "because the build stays green and everyone reads that as agreement." >&2
            exit 1
          fi

      - name: Checkout the model-execution wire specification (private)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-model-execution-spec
          path: fuaran-model-execution-spec
          token: ${{ secrets.SPEC_CORPUS_TOKEN }}

      - name: Assert the specification corpus is where the tests resolve it
        run: test -f ../fuaran-model-execution-spec/wire-fixtures/manifest.json

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fuaran-ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuaran-ts/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Typecheck covers what Build does not: each package's `build` compiles
      # `src/` only, so a type error in `test/` — the tsconfig.test.json
      # projects — reaches no gate at all. Vitest transpiles per-file without
      # checking types, so `pnpm test` is green on it too. That is not
      # hypothetical: five such errors stood on `main` while format:check,
      # build and test were all green, because nothing in CI ran `tsc` over a
      # test tree. Runs AFTER Build, because the workspace links resolve a
      # sibling package through its published `types` entry under `dist/`.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Fire the workspace wire-format cross-implementation conformance gate after a
  # successful build on a push to main. Path filters in fuaran-ui/workspace cannot
  # see pushes to THIS repo, so we POST a `wire-conformance` repository_dispatch to
  # the workspace repo (whose .github/workflows/wire-conformance.yml listens on
  # `repository_dispatch: types: [wire-conformance]`; see the workspace
  # roadmap/TIDY-UP.md "Wire the cross-conformance gate trigger" bundle).
  #
  # Requires a repo/Actions secret WORKSPACE_DISPATCH_TOKEN — a fine-grained PAT or
  # GitHub App token with `Contents: write` on fuaran-ui/workspace (the scope the
  # repository_dispatch REST endpoint requires; classic-PAT equivalent is the `repo`
  # scope). The default GITHUB_TOKEN is scoped to THIS repo only and cannot dispatch
  # cross-repo. [OPERATOR-GATED — the secret must be provisioned for this to fire.]
  notify-workspace-conformance:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workspace wire-format conformance gate
        env:
          GH_TOKEN: ${{ secrets.WORKSPACE_DISPATCH_TOKEN }}
        run: |
          # Operator-gated: until the secret is provisioned, skip rather than
          # fail — a red dispatch job on every main push would mask real
          # build/test failures.
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::WORKSPACE_DISPATCH_TOKEN is not provisioned — skipping the workspace conformance dispatch (operator-gated)."
            exit 0
          fi
          gh api repos/fuaran-ui/workspace/dispatches \
            --method POST \
            -f event_type=wire-conformance \
            -f 'client_payload[source_repo]=fuaran-ts' \
            -f 'client_payload[sha]=${{ github.sha }}'
